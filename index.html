<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#40289C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parte diario">
<meta name="application-name" content="Parte diario">
<title>Parte diario</title>
<style>
:root{color-scheme:light dark;--bg:#f4f2fb;--surface:#fff;--text:#231d3a;--muted:#675f85;--primary:#40289C;--border:#dad4ee;--soft:#ebe7f8;--danger:#a32f2f;--accent:#F4B400;--on-accent:#2a1d00}
@media(prefers-color-scheme:dark){:root{--bg:#14111f;--surface:#1e1a2e;--text:#efecf9;--muted:#b9b2d4;--primary:#b7a6f7;--border:#3a3355;--soft:#2b2543;--danger:#ff9b9b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#40289C;color:#fff;padding:22px 16px}header .inner,main{max-width:820px;margin:auto}h1{font-size:1.45rem;margin:0 0 5px}
main{padding:18px 14px 42px}
button{font:inherit;border:0;border-radius:11px;padding:11px 14px;background:var(--primary);color:#fff;cursor:pointer;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px}
button.secondary{background:var(--soft);color:var(--text);border:1px solid var(--border)}button.danger{background:var(--danger);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #79aef8;outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #00000008}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.row h2{margin:0;font-size:1.12rem}.muted{color:var(--muted);font-size:.9rem}
#partHeading{font-size:1.5rem;font-weight:800;line-height:1.2;letter-spacing:.01em;margin:0}
.tag{display:block;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
label{display:block;font-weight:650;margin:12px 0 6px}
textarea,.turno input{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px}
textarea{width:100%;resize:none;overflow:hidden}
#novedades{min-height:120px;font-size:1.05rem;line-height:1.5}
.turno{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:nowrap}
.turno b{margin-right:2px}.turno input{width:92px;font-size:1.1rem;text-align:center;padding:10px 6px;font-weight:600;letter-spacing:.02em}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{padding:8px 11px;font-size:.9rem}
.empty{text-align:center;padding:24px 10px;color:var(--muted)}.hidden{display:none!important}#notice{margin-bottom:12px;color:var(--primary);font-weight:650;min-height:1.2em}
dialog{max-width:560px;width:calc(100% - 28px);border:1px solid var(--border);border-radius:16px;padding:20px;background:var(--surface);color:var(--text)}dialog::backdrop{background:#0008}dialog h2{margin-top:0}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:0 14px 24px}
.dictate-bar{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
button.mic{padding:10px 14px;font-size:.95rem}
button.mic.recording{background:var(--danger);color:#fff;border-color:var(--danger);animation:pulse 1.3s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #a32f2f66}70%{box-shadow:0 0 0 10px #a32f2f00}100%{box-shadow:0 0 0 0 #a32f2f00}}
.dictate-status{min-height:1.2em}
@media(prefers-reduced-motion:reduce){button.mic.recording{animation:none}}
/* Vista guardada */
#viewBody{margin-top:8px}
.vturno{font-size:1.05rem;font-weight:600;line-height:1.5}
.vline{display:flex;gap:12px;margin-top:8px;font-size:1.05rem;line-height:1.5}
.vline .dot{flex:none;width:1em;text-align:center;color:var(--primary);font-size:.8em;line-height:1.9}
.vline .t{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
/* Vista previa tipo WhatsApp */
details.msg{margin-top:16px}details.msg summary{cursor:pointer;color:var(--muted);font-weight:600;padding:6px 0}
#msgPreview{margin:8px 0 0;padding:10px 12px;background:#d9fdd3;color:#111b21;border-radius:10px 10px 10px 2px;font-family:Roboto,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:.97rem;line-height:1.4;overflow-wrap:anywhere}
@media(prefers-color-scheme:dark){#msgPreview{background:#005c4b;color:#e9edef}}
.wa-title{font-weight:700}.wa-turno{white-space:pre-wrap}.wa-line{display:flex;gap:.6em}.wa-line .b{flex:none}.wa-line .t{min-width:0;white-space:pre-wrap}
/* Botones del parte */
.mainBtns{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.rowA{display:flex;gap:16px}.rowA button{flex:1 1 0;min-height:50px;font-size:1rem;padding:12px}
.rowB{display:flex;justify-content:space-between;gap:16px}.rowB button{min-width:128px;min-height:46px;font-size:.98rem;padding:10px 14px}
#deletePartBtn{color:var(--danger);border-color:var(--danger)}
/* Historial */
.point{border:1px solid var(--border);border-radius:13px;padding:14px;margin-top:12px}
.hrow{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hrow:hover,.hrow:active{background:var(--soft)}
.hrow .row{flex-wrap:nowrap}
.hmain{flex:1;min-width:0}
.hprev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.72rem;font-weight:700;vertical-align:middle}
#historyList .actions{flex-wrap:nowrap;gap:26px;justify-content:flex-end;margin-top:0}
#historyList .actions button{min-width:0;min-height:46px;padding:10px 16px}
#historyList .actions .iconbtn{width:46px;padding:0}
#historyList .actions .del{color:var(--danger);border-color:var(--danger)}
@media(prefers-color-scheme:dark){button{color:#17102b}button.danger,button.mic.recording{color:#17102b}}
.toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:nowrap;align-items:stretch}
.toolbar>button{padding:11px 10px;font-size:.95rem;white-space:nowrap}
@media(max-width:349px){.toolbar{flex-wrap:wrap}}
.menu-wrap{position:relative;margin-left:auto}
.menu-btn{width:46px;padding:11px 0;font-size:1.35rem;line-height:1}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;box-shadow:0 8px 24px #0005;z-index:20;display:flex;flex-direction:column;gap:2px}
.menu.hidden{display:none!important}
.menu button{background:transparent;color:var(--text);width:100%;justify-content:flex-start;border-radius:8px;padding:13px 12px;font-weight:600}
.menu button:hover,.menu button:active{background:var(--soft)}
</style>
</head>
<body>
<header><div class="inner"><h1>Parte Diario</h1></div></header>
<main>
<div id="notice" role="status" aria-live="polite"></div>
<div class="toolbar">
<button id="newPartBtn">＋ Parte de hoy</button>
<button class="secondary" id="historyBtn">▤ Historial</button>
<div class="menu-wrap"><button class="secondary menu-btn" id="menuBtn" aria-label="Más opciones" aria-haspopup="true" aria-expanded="false">⋮</button><div class="menu hidden" id="menu" role="menu"><button role="menuitem" id="exportBtn">⇩ Exportar respaldo</button><button role="menuitem" id="importBtn">⇧ Importar respaldo</button><button role="menuitem" id="installBtn" class="hidden">⬇ Instalar app</button></div></div>
<input class="hidden" type="file" id="importFile" accept=".json,application/json">
</div>
<section class="card" id="partCard">
<div class="partHead"><span class="muted tag" id="partTag"></span><h2 id="partHeading">PARTE</h2></div>
<div id="editArea">
<div class="turno"><b>Turno:</b><input type="text" id="turnoDesde" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="00:00" aria-label="Turno: desde (formato 24 horas)"><span>a</span><input type="text" id="turnoHasta" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="00:00" aria-label="Turno: hasta (formato 24 horas)"></div>
<label for="novedades">Novedades</label>
<textarea id="novedades" rows="3" placeholder="Durante el turno correspondiente los agentes..." autocapitalize="sentences"></textarea>
<div class="dictate-bar"><button type="button" class="secondary mic" data-target="novedades" aria-pressed="false">🎤 Dictar</button><span class="muted dictate-status" id="status-novedades" aria-live="polite"></span><span class="muted" id="saveStatus" style="margin-left:auto" aria-live="polite"></span></div>
</div>
<div id="viewArea" class="hidden"><div id="viewBody"></div></div>
<details class="msg"><summary>Ver cómo queda para WhatsApp</summary><div id="msgPreview"></div></details>
<div class="mainBtns">
<div class="rowA"><button id="saveBtn">Guardar</button><button class="secondary" id="copyBtn">⧉ Copiar texto</button></div>
<div class="rowB" id="rowB"><button class="secondary hidden" id="cancelBtn">Cancelar</button><button class="secondary hidden" id="editBtn">✎ Editar</button><button class="secondary" id="deletePartBtn">🗑 Eliminar</button></div>
</div>
</section>
<section class="card hidden" id="historyCard"><div class="row"><h2>Historial de partes</h2><button class="secondary" id="closeHistoryBtn">Cerrar</button></div><p class="muted" style="margin:10px 0 0">Tocá un parte para abrirlo.</p><div id="historyList"></div></section>
</main>
<dialog id="confirmDlg" aria-labelledby="cfTitle"><h2 id="cfTitle"></h2><p id="cfMsg"></p><div class="actions" style="justify-content:flex-end"><button class="secondary" id="cfCancel">Cancelar</button><button class="danger" id="cfOk">Eliminar</button></div></dialog>
<footer>Los datos se guardan en este navegador en el dispositivo. Exportá respaldos periódicamente para conservar una copia.</footer>
<script>
(function(){
'use strict';
const KEY='parteDiarioActividades_v1';
const DKEY='parteDiario_borradores';
const TURNO_KEY='parteDiario_ultimoTurno';
const UNIT='G.U.M';
const BULLET='●';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const fmtDate=date=>{if(!date)return '';const [y,m,d]=date.split('-');return `${d}/${m}/${y}`};
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/,TIME_RE=/^\d{2}:\d{2}$/;
function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function notify(s){$('notice').textContent=s;setTimeout(()=>{if($('notice').textContent===s)$('notice').textContent=''},4500)}

/* ===== Datos (con migración del formato anterior por actividades) ===== */
function pointsToText(points){return points.map((pt,i)=>{let t=`${i+1}. ${String(pt.activity||'').trim()}`;if(pt.observations&&String(pt.observations).trim())t+=`\n   Observaciones: ${String(pt.observations).trim()}`;return t}).join('\n\n')}
function validTurno(t){return t&&typeof t==='object'&&TIME_RE.test(t.desde||'')&&TIME_RE.test(t.hasta||'')?{desde:t.desde,hasta:t.hasta}:null}
function normalizePart(p){
 if(!p||typeof p!=='object')return null;
 const text=typeof p.text==='string'?p.text:(Array.isArray(p.points)?pointsToText(p.points):'');
 if(!text.trim())return null;
 const out={text};const t=validTurno(p.turno);if(t)out.turno=t;return out;
}
function loadDB(){
 let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
 let x={};try{x=JSON.parse(raw||'{}')}catch(e){x={}}
 if(!x||typeof x!=='object')x={};
 const out={};let changed=false;
 Object.keys(x).forEach(d=>{
  if(!DATE_RE.test(d))return;
  const n=normalizePart(x[d]);
  if(n){out[d]=Object.assign({date:d},n);if(typeof x[d].text!=='string')changed=true}else changed=true;
 });
 if(changed&&raw){
  try{if(!localStorage.getItem(KEY+'_respaldo_formato_anterior'))localStorage.setItem(KEY+'_respaldo_formato_anterior',raw)}catch(e){}
  try{localStorage.setItem(KEY,JSON.stringify(out))}catch(e){}
 }
 return out;
}
function loadDrafts(){
 try{
  const x=JSON.parse(localStorage.getItem(DKEY)||'{}'),out={};
  Object.keys(x||{}).forEach(d=>{const v=x[d];if(DATE_RE.test(d)&&v&&typeof v.text==='string'&&v.text.trim())out[d]={text:v.text,desde:String(v.desde||''),hasta:String(v.hasta||'')}});
  return out;
 }catch(e){return {}}
}
function loadTurno(){try{return validTurno(JSON.parse(localStorage.getItem(TURNO_KEY)))||{desde:'12:00',hasta:'18:00'}}catch(e){return {desde:'12:00',hasta:'18:00'}}}
let db=loadDB(),drafts=loadDrafts(),lastTurno=loadTurno(),currentDate=today(),lastToday=currentDate,savedSig='',mode='edit';
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){notify('No se pudieron guardar los datos en este navegador. Exportá un respaldo y liberá espacio.');return false}}
function persistDrafts(){try{localStorage.setItem(DKEY,JSON.stringify(drafts))}catch(e){}}
function saveLastTurno(){try{localStorage.setItem(TURNO_KEY,JSON.stringify(lastTurno))}catch(e){}}

/* ===== Mensaje para WhatsApp ===== */
const noteLines=t=>String(t||'').split('\n').map(x=>x.replace(/^\s*●\s*/,'').trim()).filter(Boolean);
const fromDisplay=v=>noteLines(v).join('\n');
const toDisplay=t=>noteLines(t).map(l=>BULLET+' '+l).join('\n');
function bulletize(v){return String(v||'').split('\n').map(l=>l.trim()===''?l:(l.startsWith(BULLET+' ')?l:BULLET+' '+l.replace(/^\s*●?\s*/,''))).join('\n')}
function turnoLine(p){return TIME_RE.test(p.desde||'')&&TIME_RE.test(p.hasta||'')?`Turno: ${p.desde} a ${p.hasta}.`:''}
/* Título en negrita de WhatsApp (*...*), Turno sin viñeta y una viñeta grande por cada línea de novedades */
function buildMessage(p){
 const out=[`*PARTE ${fmtDate(p.date)} ${UNIT}*`],t=turnoLine(p);
 if(t)out.push(t);
 noteLines(p.text).forEach(l=>out.push(`${BULLET} ${l}`));
 return out.join('\n');
}
function previewHTML(p){
 const t=turnoLine(p);
 let h=`<div class="wa-title">PARTE ${fmtDate(p.date)} ${UNIT}</div>`;
 if(t)h+=`<div class="wa-turno">${safe(t)}</div>`;
 h+=noteLines(p.text).map(l=>`<div class="wa-line"><span class="b">${BULLET}</span><span class="t">${safe(l)}</span></div>`).join('');
 return h;
}
const live=()=>({date:currentDate,desde:$('turnoDesde').value,hasta:$('turnoHasta').value,text:fromDisplay($('novedades').value)});
const fromSaved=(d,p)=>({date:d,desde:p.turno&&p.turno.desde,hasta:p.turno&&p.turno.hasta,text:p.text});
function effective(d){
 const dr=drafts[d],p=db[d];
 if(dr&&dr.text.trim())return {date:d,desde:dr.desde,hasta:dr.hasta,text:dr.text};
 return p?fromSaved(d,p):null;
}
const current=()=>mode==='edit'?live():(db[currentDate]?fromSaved(currentDate,db[currentDate]):live());

/* ===== Edición, borrador automático y guardado ===== */
function setSaveStatus(s){$('saveStatus').textContent=s}
const sig=()=>$('novedades').value+'|'+$('turnoDesde').value+'|'+$('turnoHasta').value;
function autoGrow(){const ta=$('novedades');if($('editArea').classList.contains('hidden'))return;ta.style.height='auto';ta.style.height=Math.max(ta.scrollHeight+2,120)+'px'}
function updatePreview(){$('msgPreview').innerHTML=previewHTML(current())}
/* El borrador se guarda solo mientras escribís, para no perder nada. "Guardar" lo confirma. */
function saveDraft(){
 if(mode!=='edit'||sig()===savedSig)return true;
 const v=live(),p=db[currentDate];
 const same=p&&v.text===fromDisplay(p.text)&&v.desde===(p.turno&&p.turno.desde)&&v.hasta===(p.turno&&p.turno.hasta);
 if(same||!v.text.trim()){delete drafts[currentDate];setSaveStatus('')}
 else{drafts[currentDate]={text:v.text,desde:v.desde,hasta:v.hasta};setSaveStatus('Borrador ✓')}
 persistDrafts();savedSig=sig();return true;
}
function loadInputs(p){
 $('turnoDesde').value=(p&&p.desde)||lastTurno.desde;$('turnoHasta').value=(p&&p.hasta)||lastTurno.hasta;
 $('turnoDesde').dataset.ok=$('turnoDesde').value;$('turnoHasta').dataset.ok=$('turnoHasta').value;
 $('novedades').value=toDisplay(p&&p.text);
}
function applyMode(){
 const edit=mode==='edit',has=!!db[currentDate];
 $('editArea').classList.toggle('hidden',!edit);$('viewArea').classList.toggle('hidden',edit);
 $('saveBtn').classList.toggle('hidden',!edit);
 $('cancelBtn').classList.toggle('hidden',!(edit&&has));
 $('editBtn').classList.toggle('hidden',edit);
 $('deletePartBtn').classList.toggle('hidden',!has);
 $('rowB').classList.toggle('hidden',!has);
 if(edit)autoGrow();
 else{
  const p=fromSaved(currentDate,db[currentDate]||{text:''}),t=turnoLine(p);
  $('viewBody').innerHTML=(t?`<div class="vturno">${safe(t)}</div>`:'')+noteLines(p.text).map(l=>`<div class="vline"><span class="dot">${BULLET}</span><span class="t">${safe(l)}</span></div>`).join('');
 }
 updatePreview();
}
function render(){
 const p=effective(currentDate);
 mode=(drafts[currentDate]||!db[currentDate])?'edit':'view';
 $('partHeading').textContent=`PARTE ${fmtDate(currentDate)} ${UNIT}`;
 $('partTag').textContent=currentDate===today()?'Hoy':'Parte anterior';
 loadInputs(mode==='edit'?p:null);
 if(mode==='view')loadInputs(fromSaved(currentDate,db[currentDate]));
 savedSig=sig();setSaveStatus(drafts[currentDate]?'Borrador ✓':'');
 applyMode();
}
function startEdit(){
 stopDictation();
 mode='edit';const p=db[currentDate];
 loadInputs(p?fromSaved(currentDate,p):null);savedSig=sig();setSaveStatus('');
 applyMode();$('novedades').focus();
}
function cancelEdit(){stopDictation();delete drafts[currentDate];persistDrafts();render();notify('Cambios descartados.')}
function commit(){
 stopDictation();
 const v=live();
 if(!v.text.trim()){notify('Escribí las novedades antes de guardar.');$('novedades').focus();return}
 const t=validTurno({desde:v.desde,hasta:v.hasta});
 if(!t){notify('Completá el turno: hora de inicio y de fin.');return}
 db[currentDate]={date:currentDate,text:v.text,turno:t};
 lastTurno=t;saveLastTurno();
 delete drafts[currentDate];persistDrafts();
 if(persist()){render();notify('Parte guardado.')}
}
function normalizeBullets(){
 const ta=$('novedades'),v=ta.value;if(!v)return;
 const nv=bulletize(v);if(nv===v)return;
 const pos=ta.selectionStart,A=v.split('\n'),B=nv.split('\n');let acc=0,shift=0,np=pos;
 for(let i=0;i<A.length;i++){
  const st=acc,en=acc+A[i].length,d=B[i].length-A[i].length;
  if(pos>=st&&pos<=en)np=st+shift+Math.max(Math.min(B[i].length,pos-st+d),d?2:0);
  shift+=d;acc=en+1;
 }
 ta.value=nv;try{ta.setSelectionRange(np,np)}catch(err){}
}
function fireInput(){$('novedades').dispatchEvent(new Event('input',{bubbles:true}))}
const ta0=$('novedades');
/* Cada Enter crea una viñeta nueva; Retroceso sobre una viñeta vacía la quita */
ta0.addEventListener('beforeinput',e=>{
 const v=ta0.value,s=ta0.selectionStart,en=ta0.selectionEnd;
 if(e.inputType==='insertParagraph'||e.inputType==='insertLineBreak'){
  e.preventDefault();
  const ls=v.lastIndexOf('\n',s-1)+1,nl=v.indexOf('\n',s),line=v.slice(ls,nl<0?v.length:nl);
  if(line.trim()===BULLET)return;
  ta0.setRangeText('\n'+BULLET+' ',s,en,'end');fireInput();return;
 }
 if(e.inputType==='deleteContentBackward'&&s===en){
  const ls=v.lastIndexOf('\n',s-1)+1;
  if(s===ls+2&&v.slice(ls,s)===BULLET+' '){
   e.preventDefault();
   if(ls>0){ta0.setRangeText('',ls-1,s,'end');fireInput()}
   else if(v.trim()===BULLET){ta0.value='';fireInput()}
  }
 }
});
ta0.addEventListener('input',normalizeBullets);
ta0.addEventListener('focus',()=>{if(!ta0.value)ta0.value=BULLET+' ';try{ta0.setSelectionRange(ta0.value.length,ta0.value.length)}catch(err){}});
ta0.addEventListener('blur',()=>{if(ta0.value.trim()===BULLET){ta0.value='';fireInput()}});
let saveTimer=null;
$('novedades').addEventListener('input',()=>{setSaveStatus('Escribiendo…');autoGrow();updatePreview();clearTimeout(saveTimer);saveTimer=setTimeout(saveDraft,500)});
function fixHora(v){
 const d=String(v||'').replace(/\D/g,'').slice(0,4);
 if(!d)return '';
 let h,m;
 if(d.length<=2){h=d;m='00'}else if(d.length===3){h='0'+d[0];m=d.slice(1)}else{h=d.slice(0,2);m=d.slice(2)}
 h=h.padStart(2,'0');
 return (+h<24&&+m<60)?`${h}:${m}`:null;
}
['turnoDesde','turnoHasta'].forEach(id=>{
 const el=$(id);
 el.addEventListener('input',()=>{const d=el.value.replace(/\D/g,'').slice(0,4);el.value=d.length>2?d.slice(0,2)+':'+d.slice(2):d;updatePreview()});
 el.addEventListener('focus',()=>{try{el.select()}catch(e){}});
 el.addEventListener('change',()=>{
  const f=fixHora(el.value);
  if(f===null){el.value=el.dataset.ok||'';notify('Hora no válida. Usá formato de 24 horas, por ejemplo 18:00.')}
  else{el.value=f;el.dataset.ok=f}
  updatePreview();saveDraft();
 });
});
setInterval(()=>{if(mode==='edit'){saveDraft();autoGrow();updatePreview()}},1500);
window.addEventListener('pagehide',saveDraft);
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){stopDictation();saveDraft();return}
 const t=today();
 if(t!==lastToday){if(currentDate===lastToday){saveDraft();currentDate=t;render()}lastToday=t}
});
function goTo(date){stopDictation();saveDraft();currentDate=date;showMain(true);render()}

function askConfirm(title,msg,okText){return new Promise(res=>{const d=$('confirmDlg');$('cfTitle').textContent=title;$('cfMsg').textContent=msg;$('cfOk').textContent=okText||'Eliminar';let done=false;const fin=v=>{if(done)return;done=true;if(d.close)d.close();else d.removeAttribute('open');$('cfOk').onclick=null;$('cfCancel').onclick=null;d.oncancel=null;res(v)};$('cfOk').onclick=()=>fin(true);$('cfCancel').onclick=()=>fin(false);d.oncancel=e=>{e.preventDefault();fin(false)};if(d.showModal){if(!d.open)d.showModal()}else d.setAttribute('open','');$('cfCancel').focus()})}
async function removePart(d){
 const ok=await askConfirm('Eliminar parte del '+fmtDate(d),'Se va a borrar este parte y todo su texto. Esta acción no se puede deshacer.','Sí, eliminar parte');
 if(!ok)return false;
 delete db[d];delete drafts[d];persist();persistDrafts();return true;
}
async function deleteCurrent(){
 stopDictation();
 if(!db[currentDate]){notify('Este parte todavía no está guardado.');return}
 if(await removePart(currentDate)){render();notify('Parte eliminado.')}
}
async function copyText(t){
 try{await navigator.clipboard.writeText(t);return true}catch(e){}
 try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}
}
async function copyCurrent(){
 stopDictation();saveDraft();
 const v=current();
 if(!String(v.text||'').trim()){notify('Escribí las novedades antes de copiar.');return}
 if(await copyText(buildMessage(v)))notify('Texto copiado. Pegalo en WhatsApp.');else notify('No se pudo copiar. Abrí "Ver cómo queda para WhatsApp" y copialo a mano.');
}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportDB(){saveDraft();download('respaldo-partes-diarios-'+today()+'.json',JSON.stringify({format:'parte-diario',version:2,exportedAt:new Date().toISOString(),parts:db},null,2),'application/json');notify('Respaldo exportado. Guardalo en un lugar seguro.')}
function importDB(file){
 const r=new FileReader();
 r.onload=async()=>{
  try{
   const parsed=JSON.parse(r.result);const incoming=parsed.parts;
   if(!incoming||typeof incoming!=='object')throw new Error('Formato incorrecto');
   if(!await askConfirm('Importar respaldo','Se combinarán los partes del archivo con los de este dispositivo. Si una fecha existe en ambos, se reemplazará por la versión importada.','Importar'))return;
   stopDictation();saveDraft();
   let n=0;
   Object.keys(incoming).forEach(d=>{if(!DATE_RE.test(d))return;const p=normalizePart(incoming[d]);if(p){db[d]=Object.assign({date:d},p);delete drafts[d];n++}});
   persist();persistDrafts();render();notify(`Respaldo importado (${n} ${n===1?'parte':'partes'}).`);
  }catch(e){notify('No se pudo importar. Elegí un archivo JSON de respaldo generado por esta aplicación.')}
 };
 r.readAsText(file);
}

/* ===== Historial ===== */
function showMain(on){$('partCard').classList.toggle('hidden',!on);$('historyCard').classList.toggle('hidden',on);window.scrollTo(0,0)}
const TRASH='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';
function historyDates(){
 return [...new Set([...Object.keys(db),...Object.keys(drafts)])].filter(d=>{const e=effective(d);return e&&String(e.text||'').trim()}).sort((a,b)=>b.localeCompare(a));
}
function renderHistoryList(){
 const dates=historyDates(),list=$('historyList');
 list.innerHTML='';
 if(!dates.length)list.innerHTML='<p class="empty">Todavía no hay partes guardados.</p>';
 dates.forEach(d=>{
  const e=effective(d),prev=(String(e.text).split('\n').find(l=>l.trim())||'').trim().slice(0,90);
  const row=document.createElement('div');row.className='point hrow';row.dataset.open=d;
  row.innerHTML=`<div class="row"><div class="hmain"><strong>${fmtDate(d)}</strong>${drafts[d]?'<span class="badge">Borrador</span>':''}<div class="muted hprev">${safe(prev)}</div></div><div class="actions"><button class="secondary" data-copy="${d}">Copiar</button><button class="secondary iconbtn del" data-del="${d}" aria-label="Eliminar parte" title="Eliminar">${TRASH}</button></div></div>`;
  list.appendChild(row);
 });
 list.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{e.stopPropagation();goTo(b.dataset.open)});
 list.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async e=>{e.stopPropagation();const ok=await copyText(buildMessage(effective(b.dataset.copy)));notify(ok?'Texto copiado. Pegalo en WhatsApp.':'No se pudo copiar.')});
 list.querySelectorAll('[data-del]').forEach(b=>b.onclick=async e=>{e.stopPropagation();const d=b.dataset.del;if(await removePart(d)){renderHistoryList();notify('Parte eliminado.')}});
}
function history(){stopDictation();saveDraft();renderHistoryList();showMain(false)}
$('newPartBtn').onclick=()=>{goTo(today());lastToday=today();if(mode==='edit')$('novedades').focus()};
$('saveBtn').onclick=commit;$('editBtn').onclick=startEdit;$('cancelBtn').onclick=cancelEdit;$('deletePartBtn').onclick=deleteCurrent;$('copyBtn').onclick=copyCurrent;
$('exportBtn').onclick=exportDB;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{if(e.target.files[0])importDB(e.target.files[0]);e.target.value=''};
$('historyBtn').onclick=history;$('closeHistoryBtn').onclick=()=>showMain(true);

/* ===== Dictado por voz ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recBtn=null,wantListening=false,baseText='',finalText='';let emptyRuns=0;const ANDROID=/Android/i.test(navigator.userAgent);
function micLabel(btn,on){btn.classList.toggle('recording',on);btn.setAttribute('aria-pressed',on?'true':'false');btn.textContent=on?'⏹ Detener dictado':'🎤 Dictar'}
function micStatus(id,msg){const el=$('status-'+id);if(el)el.textContent=msg||''}
function joinText(base,add){
 if(!add)return base;
 const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
 if(!base)return cap(add);
 const st=/[.!?]\s*$/.test(base)||/(^|\n)●\s*$/.test(base);
 if(/\s$/.test(base))return base+(st?cap(add):add);
 return base+' '+(st?cap(add):add);
}
function stopDictation(){
 wantListening=false;
 if(rec){const r=rec;try{r.stop()}catch(e){}}
 document.querySelectorAll('button.mic').forEach(b=>{micLabel(b,false);micStatus(b.dataset.target,'')});
 rec=null;recBtn=null;
}
function beginSession(btn){
 const id=btn.dataset.target,ta=$(id);
 baseText=ta.value;finalText='';
 const r=new SR();
 /* Chrome en Android repite frases en modo continuo: allí se usa una frase por sesión y se reinicia sola */
 r.lang='es-AR';r.continuous=!ANDROID;r.interimResults=true;r.maxAlternatives=1;
 r.onstart=()=>{if(rec!==r)return;micStatus(id,'Escuchando… hablá con claridad.')};
 r.onresult=e=>{
  if(rec!==r)return;
  if(ANDROID){
   /* Se toma solo el último resultado y se REEMPLAZA (nunca se suma), así no se duplica el texto */
   const last=e.results[e.results.length-1];
   finalText=last[0].transcript.trim();
   ta.value=bulletize(joinText(baseText,finalText));ta.scrollTop=ta.scrollHeight;
   return;
  }
  let interim='';
  for(let i=e.resultIndex;i<e.results.length;i++){
   const t=e.results[i][0].transcript;
   if(e.results[i].isFinal)finalText+=(finalText&&!/\s$/.test(finalText)?' ':'')+t.trim();
   else interim+=t;
  }
  const shown=finalText+(interim?(finalText?' ':'')+interim.trim():'');
  ta.value=bulletize(joinText(baseText,shown));
  ta.scrollTop=ta.scrollHeight;
 };
 r.onerror=e=>{
  if(rec!==r)return;
  if(e.error==='no-speech'||e.error==='aborted')return;
  const msgs={'not-allowed':'Permiso de micrófono denegado. Habilitalo en el navegador para usar el dictado.','service-not-allowed':'El navegador no permite el dictado en este contexto.','audio-capture':'No se detectó ningún micrófono.','network':'El dictado necesita conexión a Internet.','language-not-supported':'Idioma no compatible con el dictado.'};
  notify(msgs[e.error]||('Error de dictado: '+e.error));
  stopDictation();
 };
 r.onend=()=>{
  if(rec!==r)return;
  if(wantListening){
   ta.value=bulletize(joinText(baseText,finalText));
   emptyRuns=finalText?0:emptyRuns+1;
   if(emptyRuns>=4){notify('Dictado detenido: no se escuchó nada.');stopDictation();return}
   /* El navegador corta solo tras una frase o un silencio: si el usuario no detuvo, se reanuda */
   setTimeout(()=>{if(wantListening&&rec===r){try{beginSession(btn)}catch(err){stopDictation()}}},ANDROID?200:0);
  }else{micLabel(btn,false);micStatus(id,'')}
 };
 rec=r;recBtn=btn;
 r.start();
}
function toggleDictation(btn){
 if(!SR){notify('Tu navegador no admite dictado por voz. Probá con Chrome, Edge o Safari actualizados.');return}
 const same=recBtn===btn&&wantListening;
 stopDictation();saveDraft();
 if(same)return;
 emptyRuns=0;wantListening=true;micLabel(btn,true);micStatus(btn.dataset.target,'Iniciando micrófono…');
 try{beginSession(btn)}catch(err){notify('No se pudo iniciar el dictado.');stopDictation()}
}
document.querySelectorAll('button.mic').forEach(b=>b.addEventListener('click',()=>toggleDictation(b)));
if(!SR)document.querySelectorAll('.dictate-status').forEach(el=>el.textContent='Dictado no disponible en este navegador.');
/* ===== Fin dictado ===== */
/* Menú de tres puntos (respaldo) */
function closeMenu(){$('menu').classList.add('hidden');$('menuBtn').setAttribute('aria-expanded','false')}
$('menuBtn').addEventListener('click',e=>{e.stopPropagation();const open=$('menu').classList.contains('hidden');$('menu').classList.toggle('hidden',!open);$('menuBtn').setAttribute('aria-expanded',open?'true':'false')});
$('menu').addEventListener('click',()=>setTimeout(closeMenu,0));
document.addEventListener('click',e=>{if(!$('menu').contains(e.target))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
/* Instalación como app (PWA) */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('installBtn').classList.remove('hidden')});
window.addEventListener('appinstalled',()=>{deferredInstall=null;$('installBtn').classList.add('hidden');notify('App instalada.')});
$('installBtn').addEventListener('click',async()=>{if(!deferredInstall)return;const ev=deferredInstall;deferredInstall=null;$('installBtn').classList.add('hidden');try{ev.prompt();await ev.userChoice}catch(err){}});

render();
})();
