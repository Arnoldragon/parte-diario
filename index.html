<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#40289C">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parte diario">
<meta name="application-name" content="Parte diario">
<title>Parte diario</title>
<style>
:root{color-scheme:light dark;--bg:#f4f2fb;--surface:#fff;--text:#231d3a;--muted:#675f85;--primary:#40289C;--border:#dad4ee;--soft:#ebe7f8;--danger:#a32f2f;--accent:#F4B400;--on-accent:#2a1d00}
@media(prefers-color-scheme:dark){:root{--bg:#14111f;--surface:#1e1a2e;--text:#efecf9;--muted:#b9b2d4;--primary:#b7a6f7;--border:#3a3355;--soft:#2b2543;--danger:#ff9b9b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{background:#40289C;color:#fff;padding:22px 16px}header .inner,main{max-width:820px;margin:auto}h1{font-size:1.45rem;margin:0 0 5px}
main{padding:18px 14px 42px}
button{font:inherit;border:0;border-radius:11px;padding:11px 14px;background:var(--primary);color:#fff;cursor:pointer;font-weight:650;display:inline-flex;align-items:center;justify-content:center;gap:7px}
button.secondary{background:var(--soft);color:var(--text);border:1px solid var(--border)}button.danger{background:var(--danger);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #79aef8;outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #00000008}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.row h2{margin:0;font-size:1.12rem}.muted{color:var(--muted);font-size:.9rem}
#partHeading{font-size:1.28rem;font-weight:800;line-height:1.2;letter-spacing:.01em;margin:0}
.tag{display:block;font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;margin-bottom:3px}
label{display:block;font-weight:650;margin:12px 0 6px}
textarea,input[type=text]{font:inherit;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:12px}
textarea{width:100%;resize:none;overflow:hidden}
#motivos{min-height:96px;font-size:1.05rem;line-height:1.5}
#lugar{flex:1;min-width:0;font-size:1.05rem}
.turno{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:nowrap}
.turno b{margin-right:2px}.turno input,#hora{width:92px;font-size:1.1rem;text-align:center;padding:10px 6px;font-weight:600;letter-spacing:.02em}
.fechaLine{margin-top:10px;font-size:1.05rem}
.field{margin-top:16px}.field>label{margin:0 0 6px}.field>label .b{color:var(--primary)}
.inl{display:flex;gap:8px;align-items:stretch}.hrow2{display:flex;gap:10px;align-items:center}
.hrow2 button{padding:10px 12px;font-size:.92rem}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions button{padding:8px 11px;font-size:.9rem}
.empty{text-align:center;padding:24px 10px;color:var(--muted)}.hidden{display:none!important}#notice{margin-bottom:12px;color:var(--primary);font-weight:650;min-height:1.2em}
dialog{max-width:560px;width:calc(100% - 28px);border:1px solid var(--border);border-radius:16px;padding:20px;background:var(--surface);color:var(--text)}dialog::backdrop{background:#0008}dialog h2{margin-top:0}
footer{text-align:center;color:var(--muted);font-size:.82rem;padding:0 14px 24px}
.dictate-bar{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
button.mic{padding:10px 14px;font-size:.95rem}
button.mic.recording{background:var(--danger);color:#fff;border-color:var(--danger);animation:pulse 1.3s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 #a32f2f66}70%{box-shadow:0 0 0 10px #a32f2f00}100%{box-shadow:0 0 0 0 #a32f2f00}}
.dictate-status{min-height:1.2em}
@media(prefers-reduced-motion:reduce){button.mic.recording{animation:none}}
/* Vista guardada */
#viewBody{margin-top:8px}
.vturno{font-size:1.05rem;font-weight:600;line-height:1.5}
.vline{display:flex;gap:12px;margin-top:8px;font-size:1.05rem;line-height:1.5}
.vline .dot{flex:none;width:1em;text-align:center;color:var(--primary);font-size:.8em;line-height:1.9}
.vline .t{min-width:0;overflow-wrap:anywhere;white-space:pre-wrap}
/* Vista previa tipo WhatsApp */
details.msg{margin-top:16px}details.msg summary{cursor:pointer;color:var(--muted);font-weight:600;padding:6px 0}
#msgPreview{margin:8px 0 0;padding:10px 12px;background:#d9fdd3;color:#111b21;border-radius:10px 10px 10px 2px;font-family:Roboto,"Segoe UI","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:.97rem;line-height:1.4;overflow-wrap:anywhere}
@media(prefers-color-scheme:dark){#msgPreview{background:#005c4b;color:#e9edef}}
.wa-title{font-weight:700}.wa-turno{white-space:pre-wrap}.wa-line{display:flex;gap:.6em}.wa-line .b{flex:none}.wa-line .t{min-width:0;white-space:pre-wrap}
/* Botones del parte */
.mainBtns{display:flex;flex-direction:column;gap:16px;margin-top:18px}
.rowA{display:flex;gap:16px}.rowA button{flex:1 1 0;min-height:50px;font-size:1rem;padding:12px}
.rowB{display:flex;justify-content:space-between;gap:16px}.rowB button{min-width:128px;min-height:46px;font-size:.98rem;padding:10px 14px}
#deletePartBtn{color:var(--danger);border-color:var(--danger)}
/* Historial */
.point{border:1px solid var(--border);border-radius:13px;padding:14px;margin-top:12px}
.hrow{cursor:pointer;-webkit-tap-highlight-color:transparent}
.hrow:hover,.hrow:active{background:var(--soft)}
.hrow .row{flex-wrap:nowrap}
.hmain{flex:1;min-width:0}
.hprev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;background:var(--accent);color:var(--on-accent);font-size:.72rem;font-weight:700;vertical-align:middle}
#historyList .actions{flex-wrap:nowrap;gap:26px;justify-content:flex-end;margin-top:0}
#historyList .actions button{min-width:0;min-height:46px;padding:10px 16px}
#historyList .actions .iconbtn{width:46px;padding:0}
#historyList .actions .del{color:var(--danger);border-color:var(--danger)}
@media(prefers-color-scheme:dark){button{color:#17102b}button.danger,button.mic.recording{color:#17102b}}
.toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:nowrap;align-items:stretch}
.toolbar>button{padding:11px 10px;font-size:.95rem;white-space:nowrap}
@media(max-width:349px){.toolbar{flex-wrap:wrap}}
.menu-wrap{position:relative;margin-left:auto}
.menu-btn{width:46px;padding:11px 0;font-size:1.35rem;line-height:1}
.menu{position:absolute;right:0;top:calc(100% + 6px);min-width:230px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:6px;box-shadow:0 8px 24px #0005;z-index:20;display:flex;flex-direction:column;gap:2px}
.menu.hidden{display:none!important}
.menu button{background:transparent;color:var(--text);width:100%;justify-content:flex-start;border-radius:8px;padding:13px 12px;font-weight:600}
.menu button:hover,.menu button:active{background:var(--soft)}
/* ===== Diseño compacto: aprovecha la pantalla ===== */
html{height:100%}
body{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
header.bar{background:#40289C;padding:8px 10px;position:sticky;top:0;z-index:30}
.barBtns{display:flex;gap:8px;align-items:center;max-width:820px;margin:auto}
.bar .barBtns>button,.bar .menu-btn{padding:9px 12px;font-size:.95rem;min-height:42px;white-space:nowrap;background:#ffffff26;color:#fff;border:1px solid #ffffff4d}
.bar #newPartBtn{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.bar .menu-btn{width:44px;padding:9px 0;font-size:1.3rem;margin-left:auto}
.bar .menu-wrap{margin-left:auto}
.menuNote{padding:8px 12px 10px;font-size:.78rem;line-height:1.35;color:var(--muted);border-top:1px solid var(--border);margin-top:4px}
main{flex:1;display:flex;flex-direction:column;padding:8px 8px 10px;max-width:820px;width:100%}
#notice{position:fixed;left:12px;right:12px;top:auto;bottom:24px;pointer-events:none;z-index:60;margin:0;min-height:0;padding:12px 14px;border-radius:12px;background:#2b2543;color:#fff;text-align:center;font-weight:600;box-shadow:0 6px 20px #0006;max-width:560px;margin-inline:auto}
#notice:empty{display:none}
#partCard{flex:1;display:flex;flex-direction:column;padding:12px;margin-bottom:0;border-radius:14px}
#partCard.hidden{display:none!important}
#editArea{flex:1;display:flex;flex-direction:column}
#editArea.hidden,#viewArea.hidden{display:none!important}
#viewArea{flex:0 0 auto}
#partHeading{font-size:1.2rem;line-height:1.25}
.partHead{margin:0}
.turno{margin-top:8px}.fechaLine{margin-top:6px}
.turno input,#hora{padding:8px 6px;font-size:1.05rem}
.fld{display:flex;align-items:center;gap:8px;margin-top:10px}
.fld>label{flex:0 0 74px;margin:0;white-space:nowrap}
.fld>input{min-width:0}
.fld>#lugar{flex:1;padding:10px 12px}
.fld>button{padding:9px 12px;font-size:.92rem;min-height:42px}
button.mic.icon{width:46px;min-height:42px;padding:0;font-size:1.15rem}
.fldHead{display:flex;align-items:center;gap:8px;margin-top:10px;margin-bottom:6px}
.fldHead>label{margin:0;white-space:nowrap}
.fldHead>#saveStatus{margin-left:auto}
.fieldGrow{flex:0 0 auto;display:flex;flex-direction:column;min-height:0}
.fieldGrow #motivos{flex:0 0 auto;min-height:150px;padding:10px 12px}
.dictate-status{min-height:0;margin-top:4px}
.dictate-status:empty{display:none}
details.msg{margin-top:8px}details.msg summary{padding:4px 0}
.mainBtns{gap:10px;margin-top:auto;padding-top:10px}
.rowA button{min-height:46px;padding:10px}
.rowB button{min-height:42px;padding:8px 14px}
#viewBody{margin-top:6px}.vline{margin-top:6px}
.partHead{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-top:2px}
#partHeading{flex:1;min-width:0;font-size:1.1rem;margin-top:6px}
#closeBtn,#closeHistoryBtn{flex:none;width:40px;min-height:40px;padding:0;font-size:1.1rem;border-radius:50%}
#closeBtn.hidden{display:none!important}
main{padding-top:14px}
.dayGroup{margin-top:18px}
.dayHead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 4px 6px;border-bottom:2px solid var(--primary)}
.dayHead strong{font-size:1.02rem}
.dayGroup .point{margin-top:8px}
</style>
</head>
<body>
<header class="bar"><div class="barBtns">
<button id="newPartBtn">＋ Nuevo parte</button>
<button id="historyBtn">▤ Historial</button>
<div class="menu-wrap"><button class="secondary menu-btn" id="menuBtn" aria-label="Más opciones" aria-haspopup="true" aria-expanded="false">⋮</button><div class="menu hidden" id="menu" role="menu"><button role="menuitem" id="exportBtn">⇩ Exportar respaldo</button><button role="menuitem" id="importBtn">⇧ Importar respaldo</button><button role="menuitem" id="spellBtn">✓ Corrector ortográfico: sí</button><button role="menuitem" id="installBtn" class="hidden">⬇ Instalar app</button><div class="menuNote">Los datos se guardan solo en este dispositivo. Exportá respaldos de vez en cuando para conservar una copia.</div></div></div>
<input class="hidden" type="file" id="importFile" accept=".json,application/json">
</div></header>
<main>
<div id="notice" role="status" aria-live="polite"></div>
<section class="card" id="partCard">
<div class="partHead"><span class="muted tag hidden" id="partTag"></span><h2 id="partHeading">PARTE DE INCIDENCIAS G.U.M</h2><button type="button" class="secondary hidden" id="closeBtn" aria-label="Cerrar incidencia" title="Cerrar">✕</button></div>
<div id="editArea">
<div class="turno"><b>Turno:</b><input type="text" id="turnoDesde" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="00:00" aria-label="Turno: desde (formato 24 horas)"><span>a</span><input type="text" id="turnoHasta" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="00:00" aria-label="Turno: hasta (formato 24 horas)"></div>
<div class="fechaLine"><b>Fecha:</b> <span id="fechaTxt"></span></div>
<div class="fld"><label for="hora"><span class="b">●</span> Hora:</label><input type="text" id="hora" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="00:00" aria-label="Hora del hecho (formato 24 horas)"></div>
<div class="fld"><label for="lugar"><span class="b">●</span> Lugar:</label><input type="text" id="lugar" autocomplete="off" spellcheck="true" autocapitalize="sentences" placeholder="¿Dónde ocurrió?"><button type="button" class="secondary mic icon" data-target="lugar" aria-pressed="false" aria-label="Dictar lugar" title="Dictar">🎤</button></div>
<div class="muted dictate-status" id="status-lugar" aria-live="polite"></div>
<div class="fieldGrow"><div class="fldHead"><label for="motivos"><span class="b">●</span> MOTIVOS:</label><span class="muted" id="saveStatus" aria-live="polite"></span><button type="button" class="secondary mic icon" data-target="motivos" aria-pressed="false" aria-label="Dictar motivos" title="Dictar">🎤</button></div>
<textarea id="motivos" rows="3" placeholder="Describí el motivo o lo ocurrido..." spellcheck="true" autocapitalize="sentences"></textarea>
<div class="muted dictate-status" id="status-motivos" aria-live="polite"></div></div>
</div>
<div id="viewArea" class="hidden"><div id="viewBody"></div></div>
<details class="msg"><summary>Ver cómo queda para WhatsApp</summary><div id="msgPreview"></div></details>
<div class="mainBtns">
<div class="rowA"><button id="saveBtn">Guardar</button><button class="secondary" id="copyBtn">⧉ Copiar texto</button></div>
<div class="rowB" id="rowB"><button class="secondary hidden" id="cancelBtn">Cancelar</button><button class="secondary hidden" id="editBtn">✎ Editar</button><button class="secondary" id="deletePartBtn">🗑 Eliminar</button></div>
</div>
</section>
<section class="card hidden" id="historyCard"><div class="row"><h2>Historial de partes</h2><button type="button" class="secondary" id="closeHistoryBtn" aria-label="Cerrar historial" title="Cerrar">✕</button></div><p class="muted" style="margin:10px 0 0">Tocá un parte para abrirlo.</p><div id="historyList"></div></section>
</main>
<dialog id="confirmDlg" aria-labelledby="cfTitle"><h2 id="cfTitle"></h2><p id="cfMsg"></p><div class="actions" style="justify-content:flex-end"><button class="secondary" id="cfCancel">Cancelar</button><button class="danger" id="cfOk">Eliminar</button></div></dialog>

<script>
(function(){
'use strict';
const KEY='parteDiarioActividades_v1';
const DKEY='parteDiario_borradores';
const TURNO_KEY='parteDiario_ultimoTurno';
const UNIT='G.U.M';
const TITLE='PARTE DE INCIDENCIAS';
const BULLET='●';
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const nowHM=()=>{const d=new Date();return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fmtDate=date=>{if(!date)return '';const [y,m,d]=date.split('-');return `${d}/${m}/${y.slice(2)}`};
const DATE_RE=/^\d{4}-\d{2}-\d{2}$/,TIME_RE=/^\d{2}:\d{2}$/;
const newId=()=>`${today()}_${Math.random().toString(36).slice(2,8)}`;
function safe(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
/* El aviso aparece justo encima de los botones de abajo (nunca arriba, donde está el botón de cerrar) y no bloquea los toques */
function placeToast(){
 let b=24;const m=document.querySelector('.mainBtns');
 if(m&&m.offsetParent!==null){const r=m.getBoundingClientRect();b=Math.max(24,Math.round(window.innerHeight-r.top+10))}
 $('notice').style.bottom=b+'px';
}
function notify(s){const n=$('notice');n.textContent=s;placeToast();setTimeout(()=>{if(n.textContent===s)n.textContent=''},3500)}
const multi=v=>String(v||'').split('\n').map(x=>x.trim()).filter(Boolean).join('\n');
const oneLine=v=>String(v||'').replace(/\s+/g,' ').trim();

/* ===== Datos (con migración de formatos anteriores) ===== */
function pointsToText(points){return points.map((pt,i)=>{let t=`${i+1}. ${String(pt.activity||'').trim()}`;if(pt.observations&&String(pt.observations).trim())t+=`\n   Observaciones: ${String(pt.observations).trim()}`;return t}).join('\n\n')}
function validTurno(t){return t&&typeof t==='object'&&TIME_RE.test(t.desde||'')&&TIME_RE.test(t.hasta||'')?{desde:t.desde,hasta:t.hasta}:null}
function normalizePart(p,key){
 if(!p||typeof p!=='object')return null;
 const k=String(key||'');
 const date=DATE_RE.test(p.date||'')?p.date:(DATE_RE.test(k.slice(0,10))?k.slice(0,10):null);
 if(!date)return null;
 let motivos='',lugar='',hora='';
 if(typeof p.motivos==='string'||typeof p.lugar==='string'){motivos=String(p.motivos||'');lugar=String(p.lugar||'');hora=TIME_RE.test(p.hora||'')?p.hora:''}
 else motivos=typeof p.text==='string'?p.text:(Array.isArray(p.points)?pointsToText(p.points):'');
 if(!motivos.trim()&&!lugar.trim())return null;
 const out={id:k,date,created:Number(p.created)||Date.parse(date+'T00:00:00')||0,hora,lugar,motivos};
 const t=validTurno(p.turno);if(t)out.turno=t;
 return out;
}
function loadDB(){
 let raw=null;try{raw=localStorage.getItem(KEY)}catch(e){}
 let x={};try{x=JSON.parse(raw||'{}')}catch(e){x={}}
 if(!x||typeof x!=='object')x={};
 const out={};let changed=false;
 Object.keys(x).forEach(k=>{
  const n=normalizePart(x[k],k);
  if(n){out[k]=n;if(typeof x[k].motivos!=='string'&&typeof x[k].lugar!=='string')changed=true}else changed=true;
 });
 if(changed&&raw){
  try{if(!localStorage.getItem(KEY+'_respaldo_formato_novedades'))localStorage.setItem(KEY+'_respaldo_formato_novedades',raw)}catch(e){}
  try{localStorage.setItem(KEY,JSON.stringify(out))}catch(e){}
 }
 return out;
}
function loadDrafts(){
 try{
  const x=JSON.parse(localStorage.getItem(DKEY)||'{}'),out={};
  Object.keys(x||{}).forEach(k=>{
   const v=x[k];if(!v||typeof v!=='object')return;
   const motivos=typeof v.motivos==='string'?v.motivos:(typeof v.text==='string'?v.text:''),lugar=String(v.lugar||'');
   if(!motivos.trim()&&!lugar.trim())return;
   out[k]={date:DATE_RE.test(v.date||'')?v.date:(DATE_RE.test(k.slice(0,10))?k.slice(0,10):today()),created:Number(v.created)||Date.now(),desde:String(v.desde||''),hasta:String(v.hasta||''),hora:TIME_RE.test(v.hora||'')?v.hora:'',lugar,motivos,ht:!!v.ht};
  });
  return out;
 }catch(e){return {}}
}
function loadTurno(){try{return validTurno(JSON.parse(localStorage.getItem(TURNO_KEY)))||{desde:'12:00',hasta:'18:00'}}catch(e){return {desde:'12:00',hasta:'18:00'}}}
let db=loadDB(),drafts=loadDrafts(),lastTurno=loadTurno();
let cur={id:newId(),date:today(),created:Date.now()},mode='edit',savedSig='',horaTouched=false,fromHist=false,histY=0;
function persist(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){notify('No se pudieron guardar los datos en este navegador. Exportá un respaldo y liberá espacio.');return false}}
function persistDrafts(){try{localStorage.setItem(DKEY,JSON.stringify(drafts))}catch(e){}}
function saveLastTurno(){try{localStorage.setItem(TURNO_KEY,JSON.stringify(lastTurno))}catch(e){}}

/* ===== Mensaje para WhatsApp ===== */
function turnoLine(p){return TIME_RE.test(p.desde||'')&&TIME_RE.test(p.hasta||'')?`Turno: ${p.desde} a ${p.hasta}.`:''}
/* Título (negrita), Turno y Fecha sin viñeta; Hora, Lugar y MOTIVOS con viñeta */
function messageParts(p){
 const plain=[],bullets=[],t=turnoLine(p);
 if(t)plain.push(t);
 plain.push(`Fecha: ${fmtDate(p.date)}`);
 const hora=TIME_RE.test(p.hora||'')?p.hora:'',lugar=oneLine(p.lugar),motivos=multi(p.motivos);
 bullets.push(['Hora',hora],['Lugar',lugar],['MOTIVOS',motivos]);
 return {plain,bullets};
}
function buildMessage(p){
 const m=messageParts(p);
 return [`*${TITLE} ${UNIT}*`].concat(m.plain,m.bullets.map(([k,v])=>`${BULLET} ${k}:${v?' '+v:''}`)).join('\n');
}
function previewHTML(p){
 const m=messageParts(p);
 return `<div class="wa-title">${TITLE} ${UNIT}</div>`+m.plain.map(l=>`<div class="wa-turno">${safe(l)}</div>`).join('')+
  m.bullets.map(([k,v])=>`<div class="wa-line"><span class="b">${BULLET}</span><span class="t">${safe(k)}:${v?' '+safe(v):''}</span></div>`).join('');
}
const live=()=>({id:cur.id,date:cur.date,created:cur.created,desde:$('turnoDesde').value,hasta:$('turnoHasta').value,hora:$('hora').value,lugar:$('lugar').value,motivos:$('motivos').value});
const fromSaved=p=>({id:p.id,date:p.date,created:p.created,desde:p.turno&&p.turno.desde,hasta:p.turno&&p.turno.hasta,hora:p.hora,lugar:p.lugar,motivos:p.motivos});
const hasContent=v=>!!(String(v.lugar||'').trim()||String(v.motivos||'').trim());
function effective(id){
 const dr=drafts[id],p=db[id];
 if(dr&&hasContent(dr))return Object.assign({id},dr);
 return p?fromSaved(p):null;
}
const current=()=>mode==='edit'?live():(db[cur.id]?fromSaved(db[cur.id]):live());

/* ===== Edición, borrador automático y guardado ===== */
function setSaveStatus(s){$('saveStatus').textContent=s}
const sig=()=>[$('turnoDesde').value,$('turnoHasta').value,$('hora').value,$('lugar').value,$('motivos').value].join('|');
const mBase=()=>Math.max(110,Math.min(190,Math.round(window.innerHeight*0.22)));
let growVal=null,growH=0;
function autoGrow(force){
 const ta=$('motivos');if($('editArea').classList.contains('hidden'))return;
 /* Solo se recalcula si cambió el texto o el tamaño de pantalla: así la caja no se mueve mientras el teclado muestra sugerencias */
 if(!force&&ta.value===growVal&&window.innerHeight===growH)return;
 growVal=ta.value;growH=window.innerHeight;
 ta.style.height='auto';ta.style.minHeight='0';
 const h=Math.max(ta.scrollHeight+2,mBase());
 ta.style.minHeight=h+'px';ta.style.height='';
}
window.addEventListener('resize',()=>autoGrow(true));
/* Al Guardar o Copiar, la hora pasa a ser la de ese momento (salvo que la hayas fijado a mano o sea un parte ya guardado) */
function autoHora(){
 if(mode!=='edit'||db[cur.id]||horaTouched||!hasContent(live()))return;
 const h=nowHM();
 if($('hora').value!==h){$('hora').value=h;$('hora').dataset.ok=h;updatePreview()}
}
function updatePreview(){$('msgPreview').innerHTML=previewHTML(current())}
function sameAsSaved(v){
 const p=db[cur.id];if(!p)return false;
 return v.hora===p.hora&&v.lugar===p.lugar&&v.motivos===p.motivos&&v.desde===(p.turno&&p.turno.desde)&&v.hasta===(p.turno&&p.turno.hasta);
}
/* El borrador se guarda solo mientras escribís, para no perder nada. "Guardar" lo confirma. */
function saveDraft(){
 if(mode!=='edit'||sig()===savedSig)return true;
 const v=live();
 if(sameAsSaved(v)||!hasContent(v)){delete drafts[cur.id];setSaveStatus('')}
 else{drafts[cur.id]={date:cur.date,created:cur.created,desde:v.desde,hasta:v.hasta,hora:v.hora,lugar:v.lugar,motivos:v.motivos,ht:horaTouched};setSaveStatus('Borrador ✓')}
 persistDrafts();savedSig=sig();return true;
}
function loadFields(v){
 v=v||{};
 const t=(v.desde&&v.hasta)?{desde:v.desde,hasta:v.hasta}:lastTurno;
 $('turnoDesde').value=t.desde;$('turnoHasta').value=t.hasta;
 $('hora').value=v.hora||'';$('lugar').value=v.lugar||'';$('motivos').value=v.motivos||'';
 ['turnoDesde','turnoHasta','hora'].forEach(id=>{$(id).dataset.ok=$(id).value});
}
function applyMode(){
 const edit=mode==='edit',has=!!db[cur.id];
 $('editArea').classList.toggle('hidden',!edit);$('viewArea').classList.toggle('hidden',edit);
 $('saveBtn').classList.toggle('hidden',!edit);
 $('cancelBtn').classList.toggle('hidden',!(edit&&has));
 $('editBtn').classList.toggle('hidden',edit);
 $('deletePartBtn').classList.toggle('hidden',!has);
 $('rowB').classList.toggle('hidden',!has);
 $('closeBtn').classList.toggle('hidden',!(has||fromHist));
 $('partTag').textContent=edit?(has?'Editando parte guardado':'Nuevo parte'):'Parte guardado';
 $('fechaTxt').textContent=fmtDate(cur.date);
 if(edit)autoGrow(true);
 else{
  const m=messageParts(fromSaved(db[cur.id]));
  $('viewBody').innerHTML=m.plain.map(l=>`<div class="vturno">${safe(l)}</div>`).join('')+
   m.bullets.map(([k,v])=>`<div class="vline"><span class="dot">${BULLET}</span><span class="t"><b>${safe(k)}:</b>${v?' '+safe(v):''}</span></div>`).join('');
 }
 updatePreview();
}
/* Formulario nuevo: fecha de hoy y hora actual */
function resetForm(){
 fromHist=false;cur={id:newId(),date:today(),created:Date.now()};
 loadFields({hora:nowHM()});horaTouched=false;mode='edit';
 savedSig=sig();setSaveStatus('');
}
function newForm(focus){stopDictation();saveDraft();resetForm();showMain(true);applyMode();if(focus)$('lugar').focus()}
function openPart(id,h){
 stopDictation();saveDraft();if(h!==undefined)fromHist=h;
 const e=effective(id);if(!e)return;
 cur={id,date:e.date,created:e.created||Date.now()};
 mode=(drafts[id]||!db[id])?'edit':'view';
 loadFields(mode==='edit'?e:fromSaved(db[id]));
 horaTouched=!!db[id]||!!e.ht;savedSig=sig();setSaveStatus(drafts[id]?'Borrador ✓':'');
 showMain(true);applyMode();
}
function startEdit(){
 stopDictation();
 mode='edit';loadFields(fromSaved(db[cur.id]));horaTouched=true;savedSig=sig();setSaveStatus('');
 applyMode();$('lugar').focus();
}
function cancelEdit(){stopDictation();delete drafts[cur.id];persistDrafts();openPart(cur.id);notify('Cambios descartados.')}
function commit(){
 stopDictation();autoHora();
 const v=live(),t=validTurno({desde:v.desde,hasta:v.hasta});
 if(!hasContent(v)){notify('Completá el lugar y los motivos antes de guardar.');$('lugar').focus();return}
 if(!t){notify('Completá el turno: hora de inicio y de fin.');return}
 db[cur.id]={id:cur.id,date:cur.date,created:cur.created,turno:t,hora:TIME_RE.test(v.hora)?v.hora:'',lugar:v.lugar.trim(),motivos:v.motivos.trim()};
 lastTurno=t;saveLastTurno();
 delete drafts[cur.id];persistDrafts();
 if(persist()){openPart(cur.id);notify('Parte guardado.')}
}
let saveTimer=null;
['lugar','motivos'].forEach(id=>$(id).addEventListener('input',()=>{setSaveStatus('Escribiendo…');autoGrow();updatePreview();clearTimeout(saveTimer);saveTimer=setTimeout(saveDraft,500)}));
function fixHora(v){
 const d=String(v||'').replace(/\D/g,'').slice(0,4);
 if(!d)return '';
 let h,m;
 if(d.length<=2){h=d;m='00'}else if(d.length===3){h='0'+d[0];m=d.slice(1)}else{h=d.slice(0,2);m=d.slice(2)}
 h=h.padStart(2,'0');
 return (+h<24&&+m<60)?`${h}:${m}`:null;
}
['turnoDesde','turnoHasta','hora'].forEach(id=>{
 const el=$(id);
 el.addEventListener('input',()=>{const d=el.value.replace(/\D/g,'').slice(0,4);el.value=d.length>2?d.slice(0,2)+':'+d.slice(2):d;updatePreview()});
 el.addEventListener('focus',()=>{try{el.select()}catch(e){}});
 el.addEventListener('change',()=>{
  const f=fixHora(el.value);
  if(f===null){el.value=el.dataset.ok||'';notify('Hora no válida. Usá formato de 24 horas, por ejemplo 18:00.')}
  else{el.value=f;el.dataset.ok=f}
  if(id==='hora')horaTouched=true;
  updatePreview();saveDraft();
 });
});
let tickSig='';
setInterval(()=>{if(mode!=='edit')return;const g=sig();if(g!==tickSig){tickSig=g;saveDraft();autoGrow();updatePreview()}},1500);
window.addEventListener('pagehide',saveDraft);
document.addEventListener('visibilitychange',()=>{
 if(document.hidden){stopDictation();saveDraft();return}
 /* Si el formulario nuevo sigue vacío, se actualiza a la fecha y hora de este momento */
 if(mode==='edit'&&!db[cur.id]&&!hasContent(live())){
  cur.date=today();if(!horaTouched){$('hora').value=nowHM();$('hora').dataset.ok=$('hora').value}
  savedSig=sig();applyMode();
 }
});

/* Corrector ortográfico: activado por defecto; se puede apagar desde el menú ⋮ si alguna vez molesta */
const SPELL_KEY='parteDiario_corrector';
function spellOn(){try{return localStorage.getItem(SPELL_KEY)!=='0'}catch(e){return true}}
function applySpell(){
 const on=spellOn();
 ['lugar','motivos'].forEach(id=>{const e=$(id);e.spellcheck=on;e.setAttribute('autocorrect',on?'on':'off')});
 $('spellBtn').textContent=(on?'✓':'✕')+' Corrector ortográfico: '+(on?'sí':'no');
}
$('spellBtn').addEventListener('click',()=>{try{localStorage.setItem(SPELL_KEY,spellOn()?'0':'1')}catch(e){}applySpell();notify(spellOn()?'Corrector activado.':'Corrector desactivado.')});
applySpell();
function askConfirm(title,msg,okText){return new Promise(res=>{const d=$('confirmDlg');$('cfTitle').textContent=title;$('cfMsg').textContent=msg;$('cfOk').textContent=okText||'Eliminar';let done=false;const fin=v=>{if(done)return;done=true;if(d.close)d.close();else d.removeAttribute('open');$('cfOk').onclick=null;$('cfCancel').onclick=null;d.oncancel=null;res(v)};$('cfOk').onclick=()=>fin(true);$('cfCancel').onclick=()=>fin(false);d.oncancel=e=>{e.preventDefault();fin(false)};if(d.showModal){if(!d.open)d.showModal()}else d.setAttribute('open','');$('cfCancel').focus()})}
async function removePart(id){
 const e=effective(id),when=e?`${fmtDate(e.date)}${TIME_RE.test(e.hora||'')?' · '+e.hora:''}`:'';
 const ok=await askConfirm('Eliminar parte'+(when?' del '+when:''),'Se va a borrar este parte y todo su texto. Esta acción no se puede deshacer.','Sí, eliminar parte');
 if(!ok)return false;
 delete db[id];delete drafts[id];persist();persistDrafts();return true;
}
async function deleteCurrent(){
 stopDictation();
 if(!db[cur.id]){notify('Este parte todavía no está guardado.');return}
 if(await removePart(cur.id)){const back=fromHist;resetForm();if(back){history(true)}else applyMode();notify('Parte eliminado.')}
}
async function copyText(t){
 try{await navigator.clipboard.writeText(t);return true}catch(e){}
 try{const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;top:0;left:0;opacity:0';document.body.appendChild(ta);ta.select();const ok=document.execCommand('copy');ta.remove();return ok}catch(e){return false}
}
async function copyCurrent(){
 stopDictation();autoHora();saveDraft();
 const v=current();
 if(!hasContent(v)){notify('Completá el lugar y los motivos antes de copiar.');return}
 if(await copyText(buildMessage(v)))notify('Texto copiado. Pegalo en WhatsApp.');else notify('No se pudo copiar. Abrí "Ver cómo queda para WhatsApp" y copialo a mano.');
}
function download(name,content,type){const blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportDB(){saveDraft();download('respaldo-partes-'+today()+'.json',JSON.stringify({format:'parte-diario',version:3,exportedAt:new Date().toISOString(),parts:db},null,2),'application/json');notify('Respaldo exportado. Guardalo en un lugar seguro.')}
function importDB(file){
 const r=new FileReader();
 r.onload=async()=>{
  try{
   const parsed=JSON.parse(r.result);const incoming=parsed.parts;
   if(!incoming||typeof incoming!=='object')throw new Error('Formato incorrecto');
   if(!await askConfirm('Importar respaldo','Se combinarán los partes del archivo con los de este dispositivo. Si un parte existe en ambos, se reemplazará por la versión importada.','Importar'))return;
   stopDictation();saveDraft();
   let n=0;
   Object.keys(incoming).forEach(k=>{const p=normalizePart(incoming[k],k);if(p){db[k]=p;delete drafts[k];n++}});
   persist();persistDrafts();
   if(db[cur.id]||drafts[cur.id])openPart(cur.id);else applyMode();
   notify(`Respaldo importado (${n} ${n===1?'parte':'partes'}).`);
  }catch(e){notify('No se pudo importar. Elegí un archivo JSON de respaldo generado por esta aplicación.')}
 };
 r.readAsText(file);
}

/* ===== Historial ===== */
function showMain(on){$('partCard').classList.toggle('hidden',!on);$('historyCard').classList.toggle('hidden',on);window.scrollTo(0,0)}
const TRASH='<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" aria-hidden="true"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>';
const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
function dayLabel(date){
 const [y,m,d]=date.split('-').map(Number);
 let w='';try{w=new Date(y,m-1,d).toLocaleDateString('es-AR',{weekday:'long'})}catch(e){}
 return (w?cap(w)+' ':'')+fmtDate(date);
}
function historyGroups(){
 const ids=[...new Set([...Object.keys(db),...Object.keys(drafts)])].filter(id=>{const e=effective(id);return e&&hasContent(e)});
 const by={};
 ids.forEach(id=>{const e=effective(id);(by[e.date]=by[e.date]||[]).push(id)});
 const ord=id=>{const e=effective(id);return (TIME_RE.test(e.hora||'')?e.hora:'00:00')+'|'+String(e.created||0).padStart(15,'0')};
 return Object.keys(by).sort((a,b)=>b.localeCompare(a)).map(d=>({date:d,ids:by[d].sort((x,y)=>ord(y).localeCompare(ord(x)))}));
}
function renderHistoryList(){
 const groups=historyGroups(),list=$('historyList');
 list.innerHTML='';
 if(!groups.length)list.innerHTML='<p class="empty">Todavía no hay partes guardados.</p>';
 groups.forEach(g=>{
  const sec=document.createElement('section');sec.className='dayGroup';
  sec.innerHTML=`<div class="dayHead"><strong>${safe(dayLabel(g.date))}</strong><span class="muted">${g.ids.length} ${g.ids.length===1?'incidencia':'incidencias'}</span></div>`;
  g.ids.forEach(id=>{
   const e=effective(id);
   const prev=[oneLine(e.lugar),oneLine((String(e.motivos).split('\n').find(l=>l.trim())||''))].filter(Boolean).join(' — ').slice(0,100);
   const row=document.createElement('div');row.className='point hrow';row.dataset.open=id;
   row.innerHTML=`<div class="row"><div class="hmain"><strong>${TIME_RE.test(e.hora||'')?e.hora:'Sin hora'}</strong>${drafts[id]?'<span class="badge">Borrador</span>':''}<div class="muted hprev">${safe(prev)}</div></div><div class="actions"><button class="secondary" data-copy="${safe(id)}">Copiar</button><button class="secondary iconbtn del" data-del="${safe(id)}" aria-label="Eliminar parte" title="Eliminar">${TRASH}</button></div></div>`;
   sec.appendChild(row);
  });
  list.appendChild(sec);
 });
 list.querySelectorAll('[data-open]').forEach(b=>b.onclick=e=>{e.stopPropagation();histY=window.scrollY;openPart(b.dataset.open,true)});
 list.querySelectorAll('[data-copy]').forEach(b=>b.onclick=async e=>{e.stopPropagation();const ok=await copyText(buildMessage(effective(b.dataset.copy)));notify(ok?'Texto copiado. Pegalo en WhatsApp.':'No se pudo copiar.')});
 list.querySelectorAll('[data-del]').forEach(b=>b.onclick=async e=>{
  e.stopPropagation();const id=b.dataset.del;
  if(await removePart(id)){if(id===cur.id){resetForm();applyMode()}renderHistoryList();notify('Parte eliminado.')}
 });
}
function history(keep){stopDictation();saveDraft();renderHistoryList();showMain(false);if(keep)window.scrollTo(0,histY)}
/* Cerrar: vuelve al historial si la incidencia se abrió desde ahí; si no, deja un formulario nuevo */
function closePart(){stopDictation();saveDraft();const back=fromHist;resetForm();if(back)history(true);else applyMode()}
$('newPartBtn').onclick=()=>newForm(true);$('closeBtn').onclick=closePart;
$('saveBtn').onclick=commit;$('editBtn').onclick=startEdit;$('cancelBtn').onclick=cancelEdit;$('deletePartBtn').onclick=deleteCurrent;$('copyBtn').onclick=copyCurrent;
$('exportBtn').onclick=exportDB;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{if(e.target.files[0])importDB(e.target.files[0]);e.target.value=''};
$('historyBtn').onclick=history;$('closeHistoryBtn').onclick=()=>newForm(false);

/* ===== Dictado por voz ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let rec=null,recBtn=null,wantListening=false,baseText='',finalText='';let emptyRuns=0;const ANDROID=/Android/i.test(navigator.userAgent);
function micLabel(btn,on){btn.classList.toggle('recording',on);btn.setAttribute('aria-pressed',on?'true':'false');if(btn.classList.contains('icon')){btn.textContent=on?'⏹':'🎤';btn.title=on?'Detener dictado':'Dictar'}else btn.textContent=on?'⏹ Detener':'🎤 Dictar'}
function micStatus(id,msg){const el=$('status-'+id);if(el)el.textContent=msg||''}
function joinText(base,add){
 if(!add)return base;
 const cap=t=>t.charAt(0).toUpperCase()+t.slice(1);
 if(!base)return cap(add);
 const st=/[.!?]\s*$/.test(base)||/(^|\n)●\s*$/.test(base);
 if(/\s$/.test(base))return base+(st?cap(add):add);
 return base+' '+(st?cap(add):add);
}
function stopDictation(){
 wantListening=false;
 if(rec){const r=rec;try{r.stop()}catch(e){}}
 document.querySelectorAll('button.mic').forEach(b=>{micLabel(b,false);micStatus(b.dataset.target,'')});
 rec=null;recBtn=null;
}
function beginSession(btn){
 const id=btn.dataset.target,ta=$(id);
 baseText=ta.value;finalText='';
 const r=new SR();
 /* Chrome en Android repite frases en modo continuo: allí se usa una frase por sesión y se reinicia sola */
 r.lang='es-AR';r.continuous=!ANDROID;r.interimResults=true;r.maxAlternatives=1;
 r.onstart=()=>{if(rec!==r)return;micStatus(id,'Escuchando… hablá con claridad.')};
 r.onresult=e=>{
  if(rec!==r)return;
  if(ANDROID){
   /* Se toma solo el último resultado y se REEMPLAZA (nunca se suma), así no se duplica el texto */
   const last=e.results[e.results.length-1];
   finalText=last[0].transcript.trim();
   ta.value=joinText(baseText,finalText);ta.scrollTop=ta.scrollHeight;
   return;
  }
  let interim='';
  for(let i=e.resultIndex;i<e.results.length;i++){
   const t=e.results[i][0].transcript;
   if(e.results[i].isFinal)finalText+=(finalText&&!/\s$/.test(finalText)?' ':'')+t.trim();
   else interim+=t;
  }
  const shown=finalText+(interim?(finalText?' ':'')+interim.trim():'');
  ta.value=joinText(baseText,shown);
  ta.scrollTop=ta.scrollHeight;
 };
 r.onerror=e=>{
  if(rec!==r)return;
  if(e.error==='no-speech'||e.error==='aborted')return;
  const msgs={'not-allowed':'Permiso de micrófono denegado. Habilitalo en el navegador para usar el dictado.','service-not-allowed':'El navegador no permite el dictado en este contexto.','audio-capture':'No se detectó ningún micrófono.','network':'El dictado necesita conexión a Internet.','language-not-supported':'Idioma no compatible con el dictado.'};
  notify(msgs[e.error]||('Error de dictado: '+e.error));
  stopDictation();
 };
 r.onend=()=>{
  if(rec!==r)return;
  if(wantListening){
   ta.value=joinText(baseText,finalText);
   emptyRuns=finalText?0:emptyRuns+1;
   if(emptyRuns>=4){notify('Dictado detenido: no se escuchó nada.');stopDictation();return}
   /* El navegador corta solo tras una frase o un silencio: si el usuario no detuvo, se reanuda */
   setTimeout(()=>{if(wantListening&&rec===r){try{beginSession(btn)}catch(err){stopDictation()}}},ANDROID?200:0);
  }else{micLabel(btn,false);micStatus(id,'')}
 };
 rec=r;recBtn=btn;
 r.start();
}
function toggleDictation(btn){
 if(!SR){notify('Tu navegador no admite dictado por voz. Probá con Chrome, Edge o Safari actualizados.');return}
 const same=recBtn===btn&&wantListening;
 stopDictation();saveDraft();
 if(same)return;
 emptyRuns=0;wantListening=true;micLabel(btn,true);micStatus(btn.dataset.target,'Iniciando micrófono…');
 try{beginSession(btn)}catch(err){notify('No se pudo iniciar el dictado.');stopDictation()}
}
document.querySelectorAll('button.mic').forEach(b=>b.addEventListener('click',()=>toggleDictation(b)));
if(!SR)document.querySelectorAll('.dictate-status').forEach(el=>el.textContent='Dictado no disponible en este navegador.');
/* ===== Fin dictado ===== */
/* Menú de tres puntos (respaldo) */
function closeMenu(){$('menu').classList.add('hidden');$('menuBtn').setAttribute('aria-expanded','false')}
$('menuBtn').addEventListener('click',e=>{e.stopPropagation();const open=$('menu').classList.contains('hidden');$('menu').classList.toggle('hidden',!open);$('menuBtn').setAttribute('aria-expanded',open?'true':'false')});
$('menu').addEventListener('click',()=>setTimeout(closeMenu,0));
document.addEventListener('click',e=>{if(!$('menu').contains(e.target))closeMenu()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
/* Instalación como app (PWA) */
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;$('installBtn').classList.remove('hidden')});
window.addEventListener('appinstalled',()=>{deferredInstall=null;$('installBtn').classList.add('hidden');notify('App instalada.')});
$('installBtn').addEventListener('click',async()=>{if(!deferredInstall)return;const ev=deferredInstall;deferredInstall=null;$('installBtn').classList.add('hidden');try{ev.prompt();await ev.userChoice}catch(err){}});

/* Inicio: si había un borrador sin guardar, se retoma; si no, un formulario nuevo */
(function init(){
 const ids=Object.keys(drafts).filter(id=>hasContent(drafts[id])).sort((a,b)=>(drafts[b].created||0)-(drafts[a].created||0));
 if(ids.length)openPart(ids[0]);
 else{resetForm();applyMode()}
})();
